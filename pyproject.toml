[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websentry"
version = "1.2.0"
authors = [
  { name = "Isha Sonaria", email = "ishasonaria568@gmail.com" },
]
description = "Professional CLI-based web server security scanner inspired by Nikto."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28.0",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
keywords = ["security", "scanner", "vulnerability-scanner", "nikto", "audit", "web-security", "kali-linux"]

[project.urls]
Homepage = "https://github.com/ishasonaria568-prog/websentry"
Repository = "https://github.com/ishasonaria568-prog/websentry"
"Bug Tracker" = "https://github.com/ishasonaria568-prog/websentry/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
websentry = "websentry.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["websentry*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.json"]
"websentry" = ["signatures/*.json"]
"websentry.signatures" = ["*.json"]
